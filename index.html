<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Margem</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Calculadora de Margem</h1>

<div class="card">

<label>Valor de Custo</label>
<input id="custo" type="number" step="0.01">

<label>Valor de Venda</label>
<input id="venda" type="number" step="0.01">

<label>Forma de Pagamento</label>

<select id="parcela">

<option value="0.00000">Avista</option> 
<option value="0.00990">Débito</option>
<option value="0.03165">1x</option>
<option value="0.04403">2x</option>
<option value="0.05138">3x</option>
<option value="0.06007">4x</option>
<option value="0.06739">5x</option>
<option value="0.07433">6x</option>
<option value="0.08741">7x</option>
<option value="0.09513">8x</option>
<option value="0.10320">9x</option>
<option value="0.11088">10x</option>
<option value="0.11888">11x</option>
<option value="0.12695">12x</option>
<option value="0.13588">13x</option>
<option value="0.14407">14x</option>
<option value="0.15248">15x</option>
<option value="0.16084">16x</option>
<option value="0.16925">17x</option>
<option value="0.17798">18x</option>
<option value="0.18688">19x</option>
<option value="0.19575">20x</option>

</select>

<button onclick="calcular()">
Calcular
</button>

</div>

<div class="resultado">

<div>

<h3>Taxa</h3>

<p id="taxa"></p>

</div>

<div>

<h3>Valor Recebido</h3>

<p id="recebe"></p>

</div>

<div>

<h3>Lucro</h3>

<p id="lucro"></p>

</div>

<div>

<h3>Margem</h3>

<p id="margem"></p>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
